<h3>『中動態の世界　意思と責任の考古学』</h3>
<p>
バンヴェニストはさらに興味深い事実を伝えている。･･･ <strong>かつて、能動態でも受動態でもない「中動態 middle voice」なる態が存在して</strong>、これが能動態と対立していたというのである。すなわち、もともと存在していたのは、能動態と受動態の区別ではなく、能動態と中動態の区別だった。
</p>
